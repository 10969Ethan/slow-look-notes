<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="從光影與聲音開始，在熟悉的地方做一個短短的觀察練習。">
  <title>慢看筆記｜日常觀察練習集</title>
  <link rel="stylesheet" href="assets/site.css">
</head>
<body>
  <a class="skip" href="#main">跳到主要內容</a>
  <header class="bar wrap">
    <a class="brand" href="index.html"><span aria-hidden="true">◈</span> 慢看筆記</a>
    <a href="#notes">觀察練習</a>
  </header>
  <main id="main" class="wrap">
    <section class="hero" aria-labelledby="intro">
      <div>
        <p class="label">FIELD NOTES ／ 日常觀察練習集</p>
        <h1 id="intro">在熟悉的地方，<br>再看一次。</h1>
        <p>一張紙、一支筆，從光影和聲音開始。每篇練習都會帶你觀察、記錄，再留一個問題給下次。</p>
        <a class="button" href="#notes">挑一個練習 <span aria-hidden="true">↓</span></a>
      </div>
      <svg class="hero-art" viewBox="0 0 420 310" aria-hidden="true" focusable="false">
        <defs><pattern id="grid" width="23" height="23" patternUnits="userSpaceOnUse"><path d="M23 0H0v23" fill="none" stroke="#4f6d60"/></pattern></defs>
        <rect x="23" y="15" width="374" height="280" rx="8" fill="url(#grid)" stroke="#779487"/>
        <path d="M70 182C113 132 164 104 213 104s100 28 143 78c-43 50-94 78-143 78S113 232 70 182Z" fill="#d3e7c4"/>
        <circle cx="213" cy="182" r="62" fill="#90b69c"/><circle cx="213" cy="182" r="38" fill="#214238"/><circle cx="229" cy="166" r="12" fill="#fff8e5"/>
        <circle cx="318" cy="78" r="26" fill="#f7bd59"/><path d="M82 64v39m-19-20h38m241 160v25m-13-12h26" stroke="#f7bd59" stroke-width="2"/>
      </svg>
    </section>
    <section id="notes" class="collection" aria-labelledby="collection-title">
      <p class="label">THE INDEX ／ 練習索引</p>
      <h2 id="collection-title">今天想留意什麼？</h2>
      <ul class="cards">
        <li class="card light">
          <a href="notes/shadow-map.html">
            <svg viewBox="0 0 390 225" aria-hidden="true" focusable="false"><circle cx="287" cy="66" r="36" fill="#f7bd59"/><path d="M66 177 166 99 331 127 237 204Z" fill="#fbdfaa"/><path d="M91 159 164 113 293 135 222 180Z" fill="#c46b4b"/><path d="M95 157 166 110 166 50 95 95Z" fill="#213f36"/><path d="M111 103 151 77M128 83v51" stroke="#fbdfaa" stroke-width="5"/></svg>
            <div class="card-body">
              <span class="label">練習 01 ／ 光線</span>
              <h3>追一小段影子 <span aria-hidden="true">↗</span></h3>
              <p>同一個地方，在不同時間會留下不同形狀。</p>
            </div>
          </a>
        </li>
        <li class="card sound">
          <a href="notes/sound-layers.html">
            <svg viewBox="0 0 390 225" aria-hidden="true" focusable="false"><circle cx="195" cy="115" r="91" fill="#aed0b5"/><circle cx="195" cy="115" r="65" fill="#81b89b"/><circle cx="195" cy="115" r="38" fill="#396f5d"/><circle cx="195" cy="115" r="10" fill="#fff8e5"/><circle cx="254" cy="67" r="10" fill="#ffda88"/><circle cx="105" cy="138" r="8" fill="#fff8e5"/><path d="M246 157q14 4 24-9m-23 20q21 5 34-12" fill="none" stroke="#213f36" stroke-width="3"/></svg>
            <div class="card-body">
              <span class="label">練習 02 ／ 聲音</span>
              <h3>畫一張聲音地圖 <span aria-hidden="true">↗</span></h3>
              <p>先辨認近處，再把注意力慢慢推向遠處。</p>
            </div>
          </a>
        </li>
      </ul>
    </section>
  </main>
  <footer class="bar wrap"><span>慢看筆記</span><span>日常觀察練習集</span></footer>
</body>
</html>
