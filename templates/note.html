<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{摘要}}">
  <title>{{標題}}｜慢看筆記</title>
  <link rel="stylesheet" href="../assets/site.css">
</head>
<body>
  <a class="skip" href="#main">跳到主要內容</a>
  <header class="bar wrap">
    <a class="brand" href="../index.html"><span aria-hidden="true">◈</span> 慢看筆記</a>
    <a href="../index.html#notes">觀察練習</a>
  </header>
  <main id="main" class="wrap">
    <article class="entry">
      <a class="back" href="../index.html#notes">← 回練習索引</a>
      <header class="entry-header {{底色類別}}">
        <p class="label">練習 {{編號}} ／ {{分類}}</p>
        <h1>{{標題}}</h1>
        <p>{{摘要}}</p>
      </header>
      <section aria-labelledby="goal">
        <h2 id="goal">觀察目標</h2>
        <p>{{觀察目標}}</p>
      </section>
      <section aria-labelledby="steps">
        <h2 id="steps">練習步驟</h2>
        <ol class="steps">
          <li>{{步驟一}}</li>
          <li>{{步驟二}}</li>
          <li>{{步驟三}}</li>
        </ol>
      </section>
      <section class="example" aria-labelledby="example">
        <h2 id="example">紀錄示例</h2>
        <p>{{紀錄示例}}</p>
      </section>
      <section aria-labelledby="reflect">
        <h2 id="reflect">想一想</h2>
        <p>{{反思問題}}</p>
      </section>
    </article>
  </main>
  <footer class="bar wrap"><span>慢看筆記</span><span>日常觀察練習集</span></footer>
</body>
</html>
